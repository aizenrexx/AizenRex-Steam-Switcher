<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="The nine steps of a switch: read status, refuse if unsafe, build the plan, journal the intent, back up config, rename folders, set login flags, verify, clear the journal. A crash after step four is repaired on next launch.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf1fb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f6fd0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="470" fill="url(#bg)"/>
  <circle cx="600" cy="240" r="440" fill="url(#glow)"/>

  <text x="600" y="50" font-family="Segoe UI, system-ui, sans-serif" font-size="25" font-weight="700" fill="#0b1626" text-anchor="middle">What happens when you click Switch</text>
  <text x="600" y="77" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#5c7594" text-anchor="middle">Step 4 is the important one. After it, everything is recoverable.</text>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="40" y="110" width="198" height="96" rx="12" fill="#ffffff" stroke="#9fc0ea" stroke-width="1.6"/>
    <circle cx="68" cy="141" r="15" fill="#dbeafe"/>
    <text x="68" y="147" font-size="15" font-weight="700" fill="#1c5aa8" text-anchor="middle">1</text>
    <text x="94" y="147" font-size="17" font-weight="600" fill="#0b1626">Read status</text>
    <text x="58" y="174" font-size="13" fill="#5c7594">Which profile is live, is Steam</text>
    <text x="58" y="193" font-size="13" fill="#5c7594">running, are we elevated</text>

    <rect x="258" y="110" width="198" height="96" rx="12" fill="#ffffff" stroke="#e0a98a" stroke-width="1.6"/>
    <circle cx="286" cy="141" r="15" fill="#fbe3d6"/>
    <text x="286" y="147" font-size="15" font-weight="700" fill="#b35a2a" text-anchor="middle">2</text>
    <text x="312" y="147" font-size="17" font-weight="600" fill="#0b1626">Refuse if unsafe</text>
    <text x="276" y="174" font-size="13" fill="#5c7594">Steam running, or no admin</text>
    <text x="276" y="193" font-size="13" fill="#5c7594">rights - stop with a reason</text>

    <rect x="476" y="110" width="198" height="96" rx="12" fill="#ffffff" stroke="#9fc0ea" stroke-width="1.6"/>
    <circle cx="504" cy="141" r="15" fill="#dbeafe"/>
    <text x="504" y="147" font-size="15" font-weight="700" fill="#1c5aa8" text-anchor="middle">3</text>
    <text x="530" y="147" font-size="17" font-weight="600" fill="#0b1626">Build the plan</text>
    <text x="494" y="174" font-size="13" fill="#5c7594">Which folder becomes which,</text>
    <text x="494" y="193" font-size="13" fill="#5c7594">and what the flags should be</text>

    <rect x="694" y="110" width="218" height="96" rx="12" fill="#ecfdf3" stroke="#6cc99a" stroke-width="2"/>
    <circle cx="722" cy="141" r="15" fill="#c9f2dd"/>
    <text x="722" y="147" font-size="15" font-weight="700" fill="#12734a" text-anchor="middle">4</text>
    <text x="748" y="147" font-size="17" font-weight="600" fill="#0b1626">Journal the intent</text>
    <text x="712" y="174" font-size="13" fill="#2b7a53">Written to disk BEFORE</text>
    <text x="712" y="193" font-size="13" fill="#2b7a53">anything changes</text>

    <rect x="932" y="110" width="228" height="96" rx="12" fill="#ffffff" stroke="#c3b0ee" stroke-width="1.6"/>
    <circle cx="960" cy="141" r="15" fill="#ece4fb"/>
    <text x="960" y="147" font-size="15" font-weight="700" fill="#5b3bb5" text-anchor="middle">5</text>
    <text x="986" y="147" font-size="17" font-weight="600" fill="#0b1626">Back up config</text>
    <text x="950" y="174" font-size="13" fill="#5c7594">loginusers.vdf, config.vdf</text>
    <text x="950" y="193" font-size="13" fill="#5c7594">and localconfig.vdf</text>
  </g>

  <g fill="#6f96cf">
    <polygon points="258,158 248,152 248,164"/>
    <polygon points="476,158 466,152 466,164"/>
    <polygon points="694,158 684,152 684,164"/>
    <polygon points="932,158 922,152 922,164"/>
  </g>

  <path d="M1046 206 C1046 240 1058 246 1058 268" stroke="#8b6bd4" stroke-width="2" fill="none"/>
  <polygon points="1058,270 1052,260 1064,260" fill="#8b6bd4"/>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="932" y="272" width="228" height="96" rx="12" fill="#ffffff" stroke="#9fc0ea" stroke-width="1.6"/>
    <circle cx="960" cy="303" r="15" fill="#dbeafe"/>
    <text x="960" y="309" font-size="15" font-weight="700" fill="#1c5aa8" text-anchor="middle">6</text>
    <text x="986" y="309" font-size="17" font-weight="600" fill="#0b1626">Rename the folders</text>
    <text x="950" y="336" font-size="13" fill="#5c7594">The actual swap. Only the folder</text>
    <text x="950" y="355" font-size="13" fill="#5c7594">names change - nothing inside</text>

    <rect x="694" y="272" width="218" height="96" rx="12" fill="#ffffff" stroke="#9fc0ea" stroke-width="1.6"/>
    <circle cx="722" cy="303" r="15" fill="#dbeafe"/>
    <text x="722" y="309" font-size="15" font-weight="700" fill="#1c5aa8" text-anchor="middle">7</text>
    <text x="748" y="309" font-size="17" font-weight="600" fill="#0b1626">Set the login flags</text>
    <text x="712" y="336" font-size="13" fill="#5c7594">Exactly one account ends up</text>
    <text x="712" y="355" font-size="13" fill="#5c7594">flagged MostRecent 1</text>

    <rect x="476" y="272" width="198" height="96" rx="12" fill="#ffffff" stroke="#9fc0ea" stroke-width="1.6"/>
    <circle cx="504" cy="303" r="15" fill="#dbeafe"/>
    <text x="504" y="309" font-size="15" font-weight="700" fill="#1c5aa8" text-anchor="middle">8</text>
    <text x="530" y="309" font-size="17" font-weight="600" fill="#0b1626">Verify</text>
    <text x="494" y="336" font-size="13" fill="#5c7594">Re-read the disk and</text>
    <text x="494" y="355" font-size="13" fill="#5c7594">confirm the result</text>

    <rect x="258" y="272" width="198" height="96" rx="12" fill="#ecfdf3" stroke="#6cc99a" stroke-width="2"/>
    <circle cx="286" cy="303" r="15" fill="#c9f2dd"/>
    <text x="286" y="309" font-size="15" font-weight="700" fill="#12734a" text-anchor="middle">9</text>
    <text x="312" y="309" font-size="17" font-weight="600" fill="#0b1626">Clear the journal</text>
    <text x="276" y="336" font-size="13" fill="#2b7a53">Only now is the switch</text>
    <text x="276" y="355" font-size="13" fill="#2b7a53">considered finished</text>
  </g>

  <g fill="#6f96cf">
    <polygon points="932,320 942,314 942,326"/>
    <polygon points="694,320 704,314 704,326"/>
    <polygon points="476,320 486,314 486,326"/>
  </g>

  <rect x="40" y="272" width="198" height="96" rx="12" fill="#fff8ec" stroke="#d9a04e" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="58" y="303" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600" fill="#8a5a12">Crash after step 4?</text>
  <text x="58" y="330" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#9a7233">Next launch finds the journal</text>
  <text x="58" y="349" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#9a7233">and offers a one-click repair</text>

  <text x="600" y="412" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#5c7594" text-anchor="middle">Nothing outside the app folder is written, except the Steam config you asked it to switch.</text>
  <text x="600" y="437" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#7e93ad" text-anchor="middle">VDF files are parsed and rebuilt - never pattern-patched.</text>
</svg>