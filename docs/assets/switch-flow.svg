<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="The nine steps of a switch: read status, refuse if unsafe, build the plan, journal the intent, back up config, rename folders, set login flags, verify, clear the journal. A crash after step four is repaired on next launch.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1420"/><stop offset="1" stop-color="#121f31"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="470" fill="url(#bg)"/>
  <circle cx="600" cy="240" r="440" fill="url(#glow)"/>

  <text x="600" y="50" font-family="Segoe UI, system-ui, sans-serif" font-size="25" font-weight="700" fill="#f2f7ff" text-anchor="middle">What happens when you click Switch</text>
  <text x="600" y="77" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#8ea4c0" text-anchor="middle">Step 4 is the important one. After it, everything is recoverable.</text>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="40" y="110" width="198" height="96" rx="12" fill="#16243a" stroke="#3d6bb5" stroke-width="1.6"/>
    <circle cx="68" cy="141" r="15" fill="#1d3f7a"/>
    <text x="68" y="147" font-size="15" font-weight="700" fill="#8fc2ff" text-anchor="middle">1</text>
    <text x="94" y="147" font-size="17" font-weight="600" fill="#e8f1ff">Read status</text>
    <text x="58" y="174" font-size="13" fill="#8ea4c0">Which profile is live, is Steam</text>
    <text x="58" y="193" font-size="13" fill="#8ea4c0">running, are we elevated</text>

    <rect x="258" y="110" width="198" height="96" rx="12" fill="#16243a" stroke="#b5684a" stroke-width="1.6"/>
    <circle cx="286" cy="141" r="15" fill="#5a2a18"/>
    <text x="286" y="147" font-size="15" font-weight="700" fill="#ffb08a" text-anchor="middle">2</text>
    <text x="312" y="147" font-size="17" font-weight="600" fill="#e8f1ff">Refuse if unsafe</text>
    <text x="276" y="174" font-size="13" fill="#8ea4c0">Steam running, or no admin</text>
    <text x="276" y="193" font-size="13" fill="#8ea4c0">rights - stop with a reason</text>

    <rect x="476" y="110" width="198" height="96" rx="12" fill="#16243a" stroke="#3d6bb5" stroke-width="1.6"/>
    <circle cx="504" cy="141" r="15" fill="#1d3f7a"/>
    <text x="504" y="147" font-size="15" font-weight="700" fill="#8fc2ff" text-anchor="middle">3</text>
    <text x="530" y="147" font-size="17" font-weight="600" fill="#e8f1ff">Build the plan</text>
    <text x="494" y="174" font-size="13" fill="#8ea4c0">Which folder becomes which,</text>
    <text x="494" y="193" font-size="13" fill="#8ea4c0">and what the flags should be</text>

    <rect x="694" y="110" width="218" height="96" rx="12" fill="#1b2f26" stroke="#7fd6a0" stroke-width="2"/>
    <circle cx="722" cy="141" r="15" fill="#1f5c3f"/>
    <text x="722" y="147" font-size="15" font-weight="700" fill="#9ff0bd" text-anchor="middle">4</text>
    <text x="748" y="147" font-size="17" font-weight="600" fill="#eafff3">Journal the intent</text>
    <text x="712" y="174" font-size="13" fill="#9fd6b8">Written to disk BEFORE</text>
    <text x="712" y="193" font-size="13" fill="#9fd6b8">anything changes</text>

    <rect x="932" y="110" width="228" height="96" rx="12" fill="#16243a" stroke="#6a4bb5" stroke-width="1.6"/>
    <circle cx="960" cy="141" r="15" fill="#3a2a6a"/>
    <text x="960" y="147" font-size="15" font-weight="700" fill="#c9a6ff" text-anchor="middle">5</text>
    <text x="986" y="147" font-size="17" font-weight="600" fill="#e8f1ff">Back up config</text>
    <text x="950" y="174" font-size="13" fill="#8ea4c0">loginusers.vdf, config.vdf</text>
    <text x="950" y="193" font-size="13" fill="#8ea4c0">and localconfig.vdf</text>
  </g>

  <g fill="#4f7cc4">
    <polygon points="258,158 248,152 248,164"/>
    <polygon points="476,158 466,152 466,164"/>
    <polygon points="694,158 684,152 684,164"/>
    <polygon points="932,158 922,152 922,164"/>
  </g>

  <path d="M1046 206 C1046 240 1058 246 1058 268" stroke="#8b6bd4" stroke-width="2" fill="none"/>
  <polygon points="1058,270 1052,260 1064,260" fill="#8b6bd4"/>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="932" y="272" width="228" height="96" rx="12" fill="#16243a" stroke="#3d6bb5" stroke-width="1.6"/>
    <circle cx="960" cy="303" r="15" fill="#1d3f7a"/>
    <text x="960" y="309" font-size="15" font-weight="700" fill="#8fc2ff" text-anchor="middle">6</text>
    <text x="986" y="309" font-size="17" font-weight="600" fill="#e8f1ff">Rename the folders</text>
    <text x="950" y="336" font-size="13" fill="#8ea4c0">The actual swap. Only the folder</text>
    <text x="950" y="355" font-size="13" fill="#8ea4c0">names change - nothing inside</text>

    <rect x="694" y="272" width="218" height="96" rx="12" fill="#16243a" stroke="#3d6bb5" stroke-width="1.6"/>
    <circle cx="722" cy="303" r="15" fill="#1d3f7a"/>
    <text x="722" y="309" font-size="15" font-weight="700" fill="#8fc2ff" text-anchor="middle">7</text>
    <text x="748" y="309" font-size="17" font-weight="600" fill="#e8f1ff">Set the login flags</text>
    <text x="712" y="336" font-size="13" fill="#8ea4c0">Exactly one account ends up</text>
    <text x="712" y="355" font-size="13" fill="#8ea4c0">flagged MostRecent 1</text>

    <rect x="476" y="272" width="198" height="96" rx="12" fill="#16243a" stroke="#3d6bb5" stroke-width="1.6"/>
    <circle cx="504" cy="303" r="15" fill="#1d3f7a"/>
    <text x="504" y="309" font-size="15" font-weight="700" fill="#8fc2ff" text-anchor="middle">8</text>
    <text x="530" y="309" font-size="17" font-weight="600" fill="#e8f1ff">Verify</text>
    <text x="494" y="336" font-size="13" fill="#8ea4c0">Re-read the disk and</text>
    <text x="494" y="355" font-size="13" fill="#8ea4c0">confirm the result</text>

    <rect x="258" y="272" width="198" height="96" rx="12" fill="#1b2f26" stroke="#7fd6a0" stroke-width="2"/>
    <circle cx="286" cy="303" r="15" fill="#1f5c3f"/>
    <text x="286" y="309" font-size="15" font-weight="700" fill="#9ff0bd" text-anchor="middle">9</text>
    <text x="312" y="309" font-size="17" font-weight="600" fill="#eafff3">Clear the journal</text>
    <text x="276" y="336" font-size="13" fill="#9fd6b8">Only now is the switch</text>
    <text x="276" y="355" font-size="13" fill="#9fd6b8">considered finished</text>
  </g>

  <g fill="#4f7cc4">
    <polygon points="932,320 942,314 942,326"/>
    <polygon points="694,320 704,314 704,326"/>
    <polygon points="476,320 486,314 486,326"/>
  </g>

  <rect x="40" y="272" width="198" height="96" rx="12" fill="#2a1e12" stroke="#e0a355" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="58" y="303" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600" fill="#ffd08a">Crash after step 4?</text>
  <text x="58" y="330" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#d8b083">Next launch finds the journal</text>
  <text x="58" y="349" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#d8b083">and offers a one-click repair</text>

  <text x="600" y="412" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#8ea4c0" text-anchor="middle">Nothing outside the app folder is written, except the Steam config you asked it to switch.</text>
  <text x="600" y="437" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#6d829c" text-anchor="middle">VDF files are parsed and rebuilt - never pattern-patched.</text>
</svg>